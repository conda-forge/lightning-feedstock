schema_version: 1

context:
  name: lightning
  version: "2.6.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lightning-${{ version }}.tar.gz
  sha256: 1c6329e241f8a85f29fedead89c1ee138b36caa08de60c260c6a7eaee81c8295

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - fabric = lightning.fabric.cli:_main

requirements:
  host:
    - packaging
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - wheel
  run:
    - fsspec <2028.0,>=2022.5.0
    - lightning-utilities <2.0,>=0.10.0
    - packaging <27.0,>=23.0
    - python >=${{ python_min }}
    - pytorch <4.0,>=2.1.0
    - pytorch-lightning
    - pyyaml <8.0,>5.4
    - torchmetrics <3.0,>0.7.0
    - tqdm <6.0,>=4.57.0
    - typing_extensions <6.0,>4.5.0
tests:
  - python:
      imports:
        - lightning
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - click
        - python ${{ python_min }}.*
    script:
      - fabric --help
      - fabric run --help
      - fabric consolidate --help

about:
  homepage: https://github.com/Lightning-AI/pytorch-lightning
  summary: The Deep Learning framework to train, deploy, and ship AI products Lightning fast.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Borda
    - weiji14
